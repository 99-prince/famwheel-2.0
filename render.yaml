databases:
  - name: famwheel-db
    plan: free

services:
  - type: web
    name: famwheel-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: famwheel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static
          name: famwheel-web
          property: host
      - key: JWT_EXPIRES_IN
        value: 7d

  - type: web
    name: famwheel-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: famwheel-api
          property: host
